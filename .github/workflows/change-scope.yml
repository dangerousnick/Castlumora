name: Change scope
on:
  workflow_call:
    outputs:
      application:
        value: ${{ jobs.classify.outputs.application }}
permissions:
  contents: read
jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          SCOPE_TARGET: ${{ github.event.pull_request.base.sha || '' }}
          SCOPE_BASE: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
        run: |
          scope=$(python3 .github/scripts/change_scope.py --base "$SCOPE_BASE" --target-base "$SCOPE_TARGET")
          if [[ "$scope" == docs ]]; then
            python3 .github/scripts/change_scope.py --base "$SCOPE_BASE" --target-base "$SCOPE_TARGET" --check-docs
            echo 'application=false' >> "$GITHUB_OUTPUT"
          else
            echo 'application=true' >> "$GITHUB_OUTPUT"
          fi
