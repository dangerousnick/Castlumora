name: Castlumora Linux Development Preview
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: castlumora-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml
  build-verify-deliver:
    needs: scope
    if: github.event_name == 'workflow_dispatch' || (needs.scope.outputs.preview == 'true' && github.event.pull_request.number == 3 && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'development/castlumora-web-1.3')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.403
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: '.nvmrc'
      - name: Native dependencies and source identity
        id: identity
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libfontconfig1 libfreetype6
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          df -h .
      - name: Build complete clean-source Linux archive
        run: packaging/linux/build-preview.sh
      - name: Install isolated browser test runtime
        working-directory: Castlumora.Web
        run: |
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p "require('@playwright/test').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Extract actual archive and launch fresh preview
        run: |
          cd dist/preview
          sha256sum --check *.sha256
          mkdir "$RUNNER_TEMP/castlumora-extracted"
          tar -xzf *.tar.gz -C "$RUNNER_TEMP/castlumora-extracted"
          package=$(find "$RUNNER_TEMP/castlumora-extracted" -mindepth 1 -maxdepth 1 -type d -name 'Castlumora-*')
          echo "PREVIEW_PACKAGE=$package" >> "$GITHUB_ENV"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          echo "CASTLUMORA_PREVIEW_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "CASTLUMORA_PREVIEW_URL=http://127.0.0.1:28096/web/" >> "$GITHUB_ENV"
          env -u DOTNET_ROOT -u DOTNET_ROOT_X64 CASTLUMORA_DATA_DIR=/tmp/castlumora-preview-fresh "$package/start-castlumora" > "$RUNNER_TEMP/castlumora-server.log" 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
      - name: Verify packaged fresh setup and authentication
        working-directory: Castlumora.Web
        run: |
          python3 ../packaging/linux/wait-preview.py
          npm run test:browser -- browser/preview.spec.ts --grep 'fresh setup'
      - name: Restart the same package and prepare synthetic media
        run: |
          kill -TERM "$PREVIEW_PID"
          python3 - <<'PY'
          import time, urllib.request
          for _ in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:28096/health', timeout=1).close()
              except Exception:
                  break
              time.sleep(1)
          else:
              raise SystemExit('Previous preview did not stop')
          PY
          mkdir /tmp/castlumora-preview-fresh-media
          mkdir -m 700 /tmp/castlumora-preview-authorized-import
          ffmpeg -nostdin -hide_banner -v error -f lavfi -i color=c=purple:s=640x360:r=24 -f lavfi -i sine=frequency=440:sample_rate=44100 -f lavfi -i sine=frequency=880:sample_rate=44100 -t 90 -map 0:v -map 1:a -map 2:a -c:v libx264 -pix_fmt yuv420p -c:a aac -metadata:s:a:0 language=eng -metadata:s:a:1 language=spa -disposition:a:0 default -disposition:a:1 0 -movflags +faststart '/tmp/castlumora-preview-fresh-media/Castlumora Test (2026).mp4'
          echo '<movie><title>Castlumora Test</title><mpaa>G</mpaa><plot>Synthetic packaged fixture.</plot><lockdata>true</lockdata></movie>' > '/tmp/castlumora-preview-fresh-media/Castlumora Test (2026).nfo'
          printf 'WEBVTT\n\n00:00.000 --> 01:30.000\nCastlumora profile subtitle fixture\n' > '/tmp/castlumora-preview-fresh-media/Castlumora Test (2026).eng.vtt'
          env -u DOTNET_ROOT -u DOTNET_ROOT_X64 CASTLUMORA_DATA_DIR=/tmp/castlumora-preview-fresh "$PREVIEW_PACKAGE/start-castlumora" > "$RUNNER_TEMP/castlumora-restart.log" 2>&1 &
          echo "PREVIEW_PID=$!" >> "$GITHUB_ENV"
      - name: Verify restart, libraries, playback and authorized native imports
        working-directory: Castlumora.Web
        env:
          CASTLUMORA_PREVIEW_RESTART: '1'
        run: |
          python3 ../packaging/linux/wait-preview.py
          npm run test:browser -- browser/preview.spec.ts --grep 'restart|authorized public import'
      - name: Prepare retained-identity recovery fixture
        run: python3 Castlumora.Web/browser/profile-recovery-fixture.py prepare
      - name: Stop fixture and restart with interrupted provisioning intent
        run: bash packaging/linux/restart-ci-recovery-preview.sh interrupted
      - name: Verify actual packaged administrator recovery
        working-directory: Castlumora.Web
        env:
          CASTLUMORA_PREVIEW_RECOVERY_STAGE: interrupted
        run: |
          python3 ../packaging/linux/wait-preview.py
          npm run test:browser -- browser/profile-recovery.spec.ts
      - name: Restart recovered package without modifying its state
        run: bash packaging/linux/restart-ci-recovery-preview.sh persisted
      - name: Verify recovered identity survives another cold restart
        working-directory: Castlumora.Web
        env:
          CASTLUMORA_PREVIEW_RECOVERY_STAGE: persisted
        run: |
          python3 ../packaging/linux/wait-preview.py
          npm run test:browser -- browser/profile-recovery.spec.ts
      - name: Record actual CI verification
        env:
          SOURCE_SHA: ${{ steps.identity.outputs.sha }}
        run: |
          cp INSTALL_TEST_BUILD.md docs/TEST_BUILD_CHECKLIST.md dist/preview/
          cp "$PREVIEW_PACKAGE/BUILD_INFO.json" dist/preview/
          python3 - <<'PY'
          import os, pathlib
          sha=os.environ['SOURCE_SHA']
          text=f'''# Castlumora 1.0 Development Preview — Linux x64

          Exact source commit: {sha}. Development preview, not production-stable or complete Phase 1.4 parity.

          This GitHub-hosted Ubuntu 24.04 build passed frontend typecheck/lint/build and tests, self-contained linux-x64 Release publish, archive checksum verification and six browser workflow executions on the extracted package: fresh setup/login/admin/logout/security; restart/account persistence/native library creation/scanning/actual movie playback and native installation/integrity/version health of the bundled pinned yt-dlp executable, native single-video queue/form and persisted automatic-retry opt-in; authorized public HTTPS import of the repository-owned GPL synthetic clip, atomic rejection of an unsafe mixed batch, two authorized URL imports, native metadata/indexing, deduplication and browser playback. The managed-profile workflow also verified administrator creation, password-verified switching/reload, separate preferences, denied admin access, prior-token revocation, confirmed managed-profile deletion and continued movie playback, plus persisted media preferences, measured Spanish880Hz audio, a real preferred subtitle cue, administrator display-name editing, stale-label reload and unchanged viewing data/language settings after renaming. It also verified owner-managed child-device and account-wide sign-out, administrator preset/library changes, old-token rejection, exclusion/restoration of media access and retained identity/history/preferences. Followed-series controls, My List visibility, independent watchlist/resume preferences and membership across both cold-restart stages were also verified. Private episode notification opt-in, historical baselines, real newly scanned episode detection, read-state persistence at both cold restarts and final dismissal/reload were verified. Filtered Surprise Me Movie/Episode selection, allowed-library and watched-state queries, distinct rerolls, exhausted selections, explicit reset, details navigation and unchanged watch progress were verified. Native genre-interest writes, real movie recommendations, deduplicated rows, restricted-child rating/interest isolation, password-verified return to owner and interest persistence at both cold restarts were verified without changing movie progress. The server served the compiled web itself. .NET runtime is bundled; no Node/SDK/build is needed to run the preview. Native libraries and compatible FFmpeg remain external; see INSTALL_TEST_BUILD.md. No GPU or real tuner/Mint hardware certification is claimed.

          Extract the archive, run ./start-castlumora, and open http://127.0.0.1:28096/web/. Preview state and temporary files are isolated. Check the accompanying SHA-256 file and BUILD_INFO.json. Source is the exact tested commit. No main merge or production/Coon Media deployment.

          Prior local packaged-output tests at application commit 8d591a4d58cc705de1668fb7dc63a0b013cc35e4 verified all thirteen media/admin/skipper/invitation/music/photo/book/collection workflows across full and targeted runs; those broader workflows were not rerun in this CI job. See the repository verification report for exact evidence.

          Native local .info.json creator identification, generic-video browsing, safe descriptions and managed pinned yt-dlp runtime installation/health are included; source checkpoint documents exact local verification. The initial rights-confirmed direct MP4 queue/publication/admin workflow is included; the source also has separate owned TLS/native/index/media-bytes/restart and security tests in addition to these package workflows. Remaining: production-complete importing/online creator metadata (further development deferred by owner), DVR quotas/real-tuner certification, profile preset/library editing, account-wide session controls and complete advanced admin/release parity. Discovery/recommendation/notification, creator/business/storage/offline/plugin/native-client work has mixed existing implementations and unfinished scope; consult FEATURE_PARITY.md and PRODUCT_ROADMAP.md for per-feature evidence rather than interpreting these areas as absent. Registry-v2 lifecycle labels and administrator-confirmed recovery of explicit interrupted provisioning are included. Two additional browser runs stop the disposable server before recording interrupted intent, recover the original identity through the real interface, and verify another cold restart retains identity, viewing data, configuration and password-verified switching. Deletion/ambiguous legacy/active states are never reactivated. Keys and databases are retained; no production fault endpoint is added. Migration/private-snapshot coverage belongs to the backend suites, while this browser job verifies fresh-v2 profiles rather than a restored-system upgrade. Display-name and isolated media-preference editing are implemented and tested; this preview does not complete Phase1.4 or stable1.0. Compiled legacy Web is not bundled; compatible-assets attachment is documented. Native administration and inherited backend functionality are preserved. The source checkpoint's progress notes precede this post-build report.

          GitHub Actions artifact is retained for 30 days and requires GitHub sign-in. Report issues with exact commit/environment and redacted logs, never credentials.
          '''
          pathlib.Path('dist/preview/CI_SMOKE_REPORT.md').write_text(text)
          PY
      - name: Upload verified downloadable archive artifact
        id: artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Castlumora-linux-x64-${{ steps.identity.outputs.sha }}
          path: |
            dist/preview/*.tar.gz
            dist/preview/*.sha256
            dist/preview/INSTALL_TEST_BUILD.md
            dist/preview/TEST_BUILD_CHECKLIST.md
            dist/preview/BUILD_INFO.json
            dist/preview/CI_SMOKE_REPORT.md
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Sanitize failed browser context
        if: failure()
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, urllib.request, urllib.error
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'castlumora-preview-diagnostics'
          output.mkdir(exist_ok=True)
          secrets = sorted({value for name, value in os.environ.items()
                            if value and (name == 'CASTLUMORA_PREVIEW_PASSWORD' or
                            (len(value) >= 8 and re.search(r'(?i)token|password|secret|credential', name)))}, key=len, reverse=True)
          def redact(text):
              for secret in secrets:
                  text = text.replace(secret, '[redacted-secret]')
              text = re.sub(r'(?i)authorization\s*:[^\r\n]*', 'Authorization: [redacted]', text)
              return re.sub(r'(?i)[a-f0-9]{32,}', '[redacted-id-or-secret]', text)
          for index, source in enumerate(pathlib.Path('Castlumora.Web/test-results').rglob('error-context.md')):
              (output / f'context-{index}.txt').write_text(redact(source.read_text(errors='replace')))
          for name in ('castlumora-server.log', 'castlumora-restart.log', 'castlumora-recovery-interrupted.log', 'castlumora-recovery-persisted.log'):
              source = pathlib.Path(os.environ['RUNNER_TEMP']) / name
              if source.is_file():
                  with source.open('rb') as stream:
                      stream.seek(max(0, source.stat().st_size - 1048576))
                      text = stream.read().decode(errors='replace')
                  (output / (source.stem + '.txt')).write_text(redact(text))
          health = {'processAlive': False, 'httpStatus': None}
          try:
              pid = int(os.environ.get('PREVIEW_PID', '0'))
              if pid > 0:
                  os.kill(pid, 0)
                  health['processAlive'] = True
          except (OSError, ValueError):
              pass
          try:
              with urllib.request.urlopen('http://127.0.0.1:28096/health', timeout=3) as response:
                  health['httpStatus'] = response.status
          except urllib.error.HTTPError as error:
              health['httpStatus'] = error.code
          except OSError:
              health['httpStatus'] = 'unavailable'
          (output / 'health.txt').write_text(json.dumps(health))
          PY
      - name: Preserve failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: castlumora-preview-diagnostics-${{ steps.identity.outputs.sha }}
          path: |
            Castlumora.Web/test-results/**/test-failed-*.png
            ${{ runner.temp }}/castlumora-preview-diagnostics/*.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Stop only this job's preview
        if: always()
        run: |
          if [[ -n ${PREVIEW_PID:-} ]]; then kill -TERM "$PREVIEW_PID" 2>/dev/null || true; fi
