name: OpenAPI Report

on:
  workflow_run:
    workflows:
    - OpenAPI Check
    types:
    - completed

permissions: {}

jobs:
  metadata:
    name: Generate Metadata
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr_number.outputs.pr_number }}
    steps:
    - name: Get Pull Request Number
      id: pr_number
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      run: |
        API_RESPONSE=$(gh pr list --repo "${GITHUB_REPOSITORY}" --search "${HEAD_SHA}" --state open --json number)
        PR_NUMBER=$(echo "${API_RESPONSE}" | jq -r '.[0].number // empty')

        echo "repository: ${GITHUB_REPOSITORY}"
        echo "sha: ${HEAD_SHA}"
        echo "response: ${API_RESPONSE}"
        echo "pr: ${PR_NUMBER}"

        echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

  comment:
    name: Pull Request Comment
    runs-on: ubuntu-latest
    if: ${{ needs.metadata.outputs.pr_number != '' }}
    needs:
    - metadata
    permissions:
      pull-requests: write
      actions: read
      contents: read
    steps:
    # Never check out the triggering PR in this job with comment-write permission.
    - name: Check out trusted workflow implementation
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      with:
        ref: ${{ github.workflow_sha }}
        persist-credentials: false
    - name: Download OpenAPI Report
      id: download_report
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: openapi-report
        path: openapi-report
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish OpenAPI comment
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8, Node 24
      env:
        REPORT_PATH: ${{ steps.download_report.outputs.download-path }}/openapi-report.md
        PR_NUMBER: ${{ needs.metadata.outputs.pr_number }}
        REPORT_SHA: ${{ github.event.workflow_run.head_sha }}
      with:
        github-token: ${{ github.token }}
        script: |
          const publish = require('./.github/scripts/publish-openapi-report.cjs');
          await publish({ github, context, core });
