name: Tests
on:
  push:
    branches:
      - master
      - main
  # Run tests against the forked branch, but
  # do not allow access to secrets
  # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflows-in-forked-repositories
  pull_request:

env:
  SDK_VERSION: "10.0.x"

jobs:
  run-tests:
    # Linux/macOS are required. Preserve Windows diagnostics without gating this release.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
      fail-fast: false

    runs-on: "${{ matrix.os }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Python for pinned tool fixture
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0, Node 24
        with:
          python-version: '3.12'
      - name: Prepare verified OS-specific yt-dlp health fixture
        shell: bash
        run: |
          # Match the .NET process architecture, including an SDK running under Rosetta.
          tool_platform=$(DOTNET_CLI_UI_LANGUAGE=en-US dotnet --info | tr -d '\r' | awk '$1 == "RID:" {rid=$2} END {print rid}')
          case "$tool_platform" in
            linux-x64|win-x64|osx-x64|osx-arm64) ;;
            *) echo 'No reviewed executable for this runner.' >&2; exit 1 ;;
          esac
          python -m unittest discover -s packaging/yt-dlp -p 'test_*.py'
          python packaging/yt-dlp/bundle.py --platform "$tool_platform" --system-root "$RUNNER_TEMP/castlumora-tool-fixture"
          echo "CASTLUMORA_TEST_YTDLP_BUNDLE=$RUNNER_TEMP/castlumora-tool-fixture" >> "$GITHUB_ENV"

      - name: Native media inspection fixture
        shell: bash
        run: |
          if ! command -v ffprobe >/dev/null || ! command -v ffmpeg >/dev/null; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get update; sudo apt-get install -y --no-install-recommends ffmpeg ;;
              macOS) brew install ffmpeg ;;
              *) echo 'Native FFprobe fixture missing on this compatibility runner.' >&2; exit 1 ;;
            esac
          fi
          probe_fixture=$(command -v ffprobe)
          if [[ "$RUNNER_OS" == Windows ]]; then probe_fixture=$(cygpath -w "$probe_fixture"); fi
          encoder_fixture=$(command -v ffmpeg)
          if [[ "$RUNNER_OS" == Windows ]]; then encoder_fixture=$(cygpath -w "$encoder_fixture"); fi
          "$probe_fixture" -version
          "$encoder_fixture" -version
          echo "CASTLUMORA_TEST_FFMPEG=$encoder_fixture" >> "$GITHUB_ENV"
          echo "CASTLUMORA_TEST_FFPROBE=$probe_fixture" >> "$GITHUB_ENV"

      - name: Build Debug server on required platforms
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: dotnet build Jellyfin.Server -m:1

      - name: Build Release solution
        run: dotnet build Jellyfin.sln --configuration Release -m:1

      - name: Run DotNet CLI Tests
        run: >
          dotnet test Jellyfin.sln
          --configuration Release
          --collect:"XPlat Code Coverage"
          --settings tests/coverletArgs.runsettings
          --verbosity minimal
          --logger "trx;LogFilePrefix=server-tests"
          -m:1

      - name: Merge code coverage results
        uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
        with:
          reports: "**/coverage.cobertura.xml"
          targetdir: "merged/"
          reporttypes: "Cobertura"

      - name: Retain Windows compatibility test diagnostics
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24
        with:
          name: windows-compatibility-${{ github.event.pull_request.head.sha || github.sha }}
          path: '**/TestResults/**/*.trx'
          if-no-files-found: warn
          retention-days: 30

      # TODO - which action / tool to use to publish code coverage results?
      # - name: Publish code coverage results
