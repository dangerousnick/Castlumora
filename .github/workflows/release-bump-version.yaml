name: '🆙 Auto bump_version'

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      TAG_BRANCH:
        required: true
        description: release-x.y.z
      NEXT_VERSION:
        required: true
        description: x.y.z

jobs:
  auto_bump_version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'release' && !contains(github.event.release.tag_name, 'rc') }}
    env:
      TAG_BRANCH: ${{ github.event.release.target_commitish }}
    steps:
      - name: Wait for deploy checks to finish
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8, Node 24
        timeout-minutes: 61
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const { data: run } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            const deadline = Date.now() + 3600000;
            while (Date.now() < deadline) {
              const suites = await github.paginate(github.rest.checks.listSuitesForRef, {
                owner, repo, ref: process.env.TAG_BRANCH, per_page: 100
              });
              if (suites.filter(s => s.id !== run.check_suite_id).every(s => s.status === 'completed')) return;
              await new Promise(resolve => setTimeout(resolve, 60000));
            }
            throw new Error('Timed out waiting for deployment checks');

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_BRANCH }}

      - name: Read release version
        id: release_version
        uses: mikefarah/yq@f2944b823f84906a127dbd29e4c2a3e60c4e550e # v4.54.3, Docker (no deprecated Node runtime)
        with:
          cmd: yq -r '.version' build.yaml

      - name: Setup EnvVars
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.result }}
        run: |-
          CURRENT_VERSION="$RELEASE_VERSION"
          CURRENT_MAJOR_MINOR=${CURRENT_VERSION%.*}
          CURRENT_PATCH=${CURRENT_VERSION##*.}
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
          echo "CURRENT_MAJOR_MINOR=${CURRENT_MAJOR_MINOR}" >> $GITHUB_ENV
          echo "CURRENT_PATCH=${CURRENT_PATCH}" >> $GITHUB_ENV
          echo "NEXT_VERSION=${CURRENT_MAJOR_MINOR}.$(($CURRENT_PATCH + 1))" >> $GITHUB_ENV

      - name: Run bump_version
        run: ./bump_version ${{ env.NEXT_VERSION }}

      - name: Commit Changes
        run: |-
          git config user.name "jellyfin-bot"
          git config user.email "team@jellyfin.org"
          git checkout ${{ env.TAG_BRANCH }}
          git commit -am "Bump version to ${{ env.NEXT_VERSION }}"
          git push origin ${{ env.TAG_BRANCH }}

  manual_bump_version:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    env:
      TAG_BRANCH: ${{ github.event.inputs.TAG_BRANCH }}
      NEXT_VERSION: ${{ github.event.inputs.NEXT_VERSION }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG_BRANCH }}

      - name: Run bump_version
        run: ./bump_version ${{ env.NEXT_VERSION }}

      - name: Commit Changes
        run: |-
          git config user.name "jellyfin-bot"
          git config user.email "team@jellyfin.org"
          git checkout ${{ env.TAG_BRANCH }}
          git commit -am "Bump version to ${{ env.NEXT_VERSION }}"
          git push origin ${{ env.TAG_BRANCH }}
